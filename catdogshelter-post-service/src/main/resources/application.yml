server:
  port: 8000
  tomcat:
    max-connections: 200

spring:
  application:
    name: CATDOGSHELTER-POST-SERVICE
  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        '[format_sql]': true

  profiles:
    active: dev

  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/catdogshelter
    username: backoven
    password: backoven
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

# fatal -> error -> warn -> info -> debug -> trace
logging:
  level:
    root: info

file:
  upload-Dir: C:\uploadFiles\img\multi
filepath: C:\uploadFiles\img\multi
